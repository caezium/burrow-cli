name: ci

# Cross-platform build + test matrix: formatting, clippy (warnings = errors),
# and the test suite on Linux/macOS/Windows, plus a Windows release artifact.
# License scanning is a separate concern — see license-scan.yml.

on:
  push:
  pull_request:

jobs:
  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - name: Check formatting
        run: cargo fmt --check
      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings
      - name: Tests
        run: cargo test --all-targets
      - name: Build Windows release artifact
        if: ${{ matrix.os == 'windows-latest' }}
        run: cargo build --release
      - name: Upload Windows release artifact
        if: ${{ matrix.os == 'windows-latest' }}
        uses: actions/upload-artifact@v4
        with:
          name: burrow-windows-x86_64
          path: target/release/burrow.exe
